server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # El backend NO tiene prefijo /api: la barra final en proxy_pass
    # hace que nginx quite "/api" antes de reenviar al backend
    # (/api/auth/login -> http://backend:8080/auth/login).
    location /api/ {
        proxy_pass http://backend:8080/;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

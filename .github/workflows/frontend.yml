# Construye la imagen del frontend y la publica en ghcr.io
name: Frontend
on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend.yml"]
  workflow_dispatch: # permite ejecutarlo a mano desde GitHub

jobs:
  imagen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # permiso para publicar en ghcr.io
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Iniciar sesión en ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nombre de la imagen (en minúsculas)
        run: echo "IMAGEN=ghcr.io/${GITHUB_REPOSITORY,,}-frontend" >> "$GITHUB_ENV"

      - name: Construir y publicar la imagen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
